[project]
name = "verifiably-refs"
version = "0.1.0"
description = "Vocabulary identifiers pinned to releases: the reference layer above nodes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keith Hughitt", email = "keith.hughitt@gmail.com" }]
requires-python = ">=3.11"
classifiers = ["Typing :: Typed"]
dependencies = [
  "pydantic>=2.0",
  "rfc8785>=0.1.4,<0.2",
  "verifiably-nodes",
]

[build-system]
requires = ["hatchling>=1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.5"
packages = ["src/refs"]
# The registry copy is gitignored (written by `just registry-sync`); ship it anyway.
artifacts = ["src/refs/data/*"]

[tool.uv.sources]
verifiably-nodes = { path = "../../nodes/python" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15.7",
    "pyright>=1.1.390",
    "pytest-testmon>=2.2.0",
]
